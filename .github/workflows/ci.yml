name: Solutions 4 U CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  # JOB 1: Kotlin app (root level)
  build-kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Kotlin app
        run: ./gradlew build

      - name: Run Kotlin tests
        run: ./gradlew test

  # JOB 2: Node.js backend (./backend folder)
  build-node-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run backend tests
        run: npm test
