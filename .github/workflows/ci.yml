# Solutions 4 U - CI Pipeline
# This file lives at: .github/workflows/ci.yml
# It runs automatically every time code is pushed or a PR is opened
name: Solutions 4 U CI

# WHEN does the robot wake up?
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

# WHAT does the robot do?
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      # Step 1: Grab the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up JDK (Kotlin runs on Java)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Make Gradle executable 
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # Step 4: Try to build the app (does it compile?)
      - name: Build the app
        run: ./gradlew build

      # Step 5: Run the tests (does the old stuff still work?)
      - name: Run tests
        run: ./gradlew test
